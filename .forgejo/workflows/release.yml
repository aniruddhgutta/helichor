on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: codeberg-tiny
    env:
      TAG: ${{ github.ref_name }}
      TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CRX_KEY_THEME: ${{ secrets.CRX_KEY_THEME }}
      CRX_KEY_NEWTAB: ${{ secrets.CRX_KEY_NEWTAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: |
          set -eu
          command -v npx >/dev/null || { apt-get update -qq && apt-get install -y -qq nodejs npm; }
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"

          for d in theme newtab; do jq . "$d/manifest.json" >/dev/null; done

          printf '%s\n' "$CRX_KEY_THEME" > /tmp/theme.pem
          printf '%s\n' "$CRX_KEY_NEWTAB" > /tmp/newtab.pem

          for d in theme newtab; do
            name="helichor-$d-$TAG"
            npx --yes crx3 -p "/tmp/$d.pem" -o "$name.crx" "$d"
          done

          id=$(curl -fsS -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                    -d "{\"tag_name\":\"$TAG\"}" "$api" | jq .id)

          for f in *.crx; do
            curl -fsS -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/$id/assets?name=$f"
          done
